<style>
:root {
  --wall: #0b0c26;
  --ink: #eadfcb;
  --muted: #a39bcc;
  --glow: #ffcf9a;
  --line: rgba(255, 207, 154, 0.38);
  --accent: #c45c48;
  --ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--wall); color: var(--ink); font-family: var(--ui); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
.brand {
  position: fixed; top: 0; left: 0; right: 0;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 0;
  pointer-events: none; z-index: 2;
  text-shadow: 0 2px 18px rgba(11, 12, 38, 0.65);
}

  margin: 0; font: 700 clamp(26px, 5vw, 40px)/1.1 var(--ui);
  letter-spacing: 0.02em; color: var(--glow);
}

  margin: 6px 0 0; font: 500 12px/1.35 var(--ui);
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
.strip {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, rgba(11, 12, 38, 0.78), rgba(11, 12, 38, 0));
  pointer-events: none; z-index: 2;
}
.strip > * { pointer-events: auto; }
button {
  font: 600 12px/1 var(--ui); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--glow); background: rgba(11, 12, 38, 0.45); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
}
button:hover { background: rgba(255, 212, 160, 0.12); }
button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
button[aria-pressed="true"] { background: rgba(255, 212, 160, 0.2); }
@media (max-width: 640px) {
  .brand h1 { font-size: 22px; }
  .brand p { font-size: 10px; }
  .strip { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; gap: 6px; padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px)); pointer-events: auto; scrollbar-width: none; }

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
(function () {
'use strict';
const loadingEl = document.getElementById('loading');
if (!window.THREE || !THREE.OrbitControls) {
  loadingEl.textContent = 'The 3D library could not load. Check the connection and reload the page.';
  return;
}

const TAU = Math.PI * 2;
let _s = 0x51a0f1e5;
const R = () => { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rnd = (a, b) => b === undefined ? R() * a : a + R() * (b - a);
const gauss = () => { let u = 0; while (!u) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * R()); };
const pick = (a) => a[Math.floor(R() * a.length)];
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const N = (() => {
  const p = new Uint8Array(512), perm = []; for (let i = 0; i < 256; i++) perm.push(i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(R() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const grad = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const n2 = (x, y) => { let X = Math.floor(x), Y = Math.floor(y); x -= X; y -= Y; X &= 255; Y &= 255; const u = fade(x), v = fade(y), a = p[X] + Y, b = p[X + 1] + Y; return lerp(lerp(grad(p[a], x, y), grad(p[b], x - 1, y), u), lerp(grad(p[a + 1], x, y - 1), grad(p[b + 1], x - 1, y - 1), u), v); };
  const fbm = (x, y, o = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * n2(x * f, y * f); f *= 2.03; a *= 0.5; } return s; };
  return { n2, fbm };
})();
const col = (h) => new THREE.Color(h);
const dirAzEl = (az, el) => new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
const DEG = Math.PI / 180;
const v3 = (h) => { const c = new THREE.Color(h); return `vec3(${c.r.toFixed(4)},${c.g.toFixed(4)},${c.b.toFixed(4)})`; };
function rampGLSL(name, stops) {
  let s = `vec3 ${name}(float t){ t = clamp(t, 0.0, 1.0);\n`;
  for (let i = 1; i < stops.length; i++) {
    const [a, ca] = stops[i - 1], [b, cb] = stops[i];
    s += `  ${i > 1 ? 'else ' : ''}if (t <= ${b.toFixed(4)}) return mix(${v3(ca)}, ${v3(cb)}, (t - ${a.toFixed(4)}) / ${(b - a).toFixed(4)});\n`;
  }
  return s + `  return ${v3(stops[stops.length - 1][1])};\n}\n`;
}
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); return t; }

// ---------------------------------------------------------------- Hanoi geography
const SUN = dirAzEl(-42 * DEG, 4 * DEG);
const MOON = dirAzEl(-35 * DEG, 28 * DEG);
const RM = 450;
const inDisc = (x, z, m = 0) => x * x + z * z < (RM - m) * (RM - m);
const WATER_Y = 0.2;

// Hoàn Kiếm Lake — elongated oval slightly north of center
const LK = { cx: 10, cz: -12, rx: 95, rz: 122 };
const lakeD = (x, z) => 1 - Math.hypot((x - LK.cx) / LK.rx, (z - LK.cz) / LK.rz);
const inLake = (x, z) => lakeD(x, z) > 0;

// Ngọc Sơn island (north of lake)
const NG = { cx: 8, cz: -92, rx: 28, rz: 20 };
const inNgoc = (x, z) => Math.hypot((x - NG.cx) / NG.rx, (z - NG.cz) / NG.rz) < 1;

// West Lake lobe (west edge of island)
const WL = { cx: -250, cz: -40, rx: 130, rz: 160 };
const westLakeD = (x, z) => 1 - Math.hypot((x - WL.cx) / WL.rx, (z - WL.cz) / WL.rz);

// Red River — eastern corridor
const riverX = (z) => 265 + 18 * Math.sin(z * 0.012) + 8 * N.n2(z * 0.02, 2.2);
const riverW = () => 55;
const inRiver = (x, z) => Math.abs(x - riverX(z)) < riverW() / 2;

function landF(x, z) {
  const edge = (RM - Math.hypot(x, z)) / 40;
  const hk = lakeD(x, z);
  const wl = westLakeD(x, z);
  const rr = (Math.abs(x - riverX(z)) - riverW() / 2) / 18;
  let f = Math.min(edge, rr);
  if (hk > 0 && !inNgoc(x, z)) f = Math.min(f, -hk);
  if (wl > 0.15) f = Math.min(f, -wl + 0.15);
  return f + N.fbm(x * 0.014, z * 0.014, 3) * 0.12;
}

function H(x, z) {
  const lf = landF(x, z);
  if (inLake(x, z) && !inNgoc(x, z)) return WATER_Y - 1.4;
  if (westLakeD(x, z) > 0.12) return WATER_Y - 1.2;
  if (inRiver(x, z)) return WATER_Y - 1.5;
  if (lf < -0.2) return -4;
  let h = 1.4 + N.fbm(x * 0.015, z * 0.015, 3) * 1.1;
  // slight rise toward Ba Đình / west of Old Quarter
  h += 4 * Math.exp(-(((x + 40) / 90) ** 2 + ((z + 160) / 70) ** 2));
  if (inNgoc(x, z)) h = Math.max(h, 2.2);
  if (lf < 0.1) h = lerp(-4, h, sstep(-0.2, 0.1, lf));
  return h;
}

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const LOW_POWER = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0);
const DPR = Math.min(window.devicePixelRatio || 1, LOW_POWER ? 1.25 : 1.75);
renderer.setPixelRatio(DPR);
const scene = new THREE.Scene();
const FOG = col('#e2a9b4'), FOG_NEAR = 1100, FOG_FAR = 4200;
scene.fog = new THREE.Fog(FOG, FOG_NEAR, FOG_FAR);
const camera = new THREE.PerspectiveCamera(45, 1, 1, 8000);
const VIEWS = {
  overview: { pos: new THREE.Vector3(360, 245, 480), target: new THREE.Vector3(-5, 16, -25) },
  painting: { pos: new THREE.Vector3(150, 18, 110), target: new THREE.Vector3(8, 7, -55) },
};
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
camera.position.copy(VIEWS.overview.pos);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.copy(VIEWS.overview.target); controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 18; controls.maxDistance = 1800; controls.maxPolarAngle = Math.PI * 0.62; controls.autoRotateSpeed = 0.4;
controls.autoRotate = !reduceMotion;
controls.update();
const uTime = { value: 0 }, uNight = { value: 0 }, uWet = { value: 0 };

const grad = (() => { const d = new Uint8Array([86, 86, 86, 255, 160, 160, 160, 255, 235, 235, 235, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const toon = (c, extra) => new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: grad }, extra || {}));
const hemiLight = new THREE.HemisphereLight(0x9b8fd8, 0x33285a, 0.95); scene.add(hemiLight);
const sunLight = new THREE.DirectionalLight(0xffb487, 1.4); sunLight.position.set(-650, 190, -280); scene.add(sunLight);
const fillLight = new THREE.DirectionalLight(0x7a72c0, 0.28); fillLight.position.set(280, 200, 360); scene.add(fillLight);
const dummy = new THREE.Object3D();

// ---------------------------------------------------------------- sky
const SKY_STOPS = [[0, '#141a52'], [0.09, '#1d2873'], [0.2, '#2b449f'], [0.31, '#4268bf'], [0.41, '#6a95d6'], [0.5, '#9aa2dc'], [0.6, '#cf9fd0'], [0.7, '#f39fb0'], [0.8, '#ffa98e'], [0.9, '#ffc48e'], [1, '#ffdfa4']];
const CLOUD_STOPS = [[0, '#4e4a88'], [0.2, '#6c6ab0'], [0.36, '#9786c4'], [0.5, '#c993c2'], [0.63, '#f0a0b4'], [0.76, '#ffb694'], [0.88, '#ffd5a6'], [1, '#fff4de']];
const SKY_GLSL = rampGLSL('skyRamp', SKY_STOPS) + `
uniform float uNight; uniform float uWet;
vec3 skyColor(vec3 d, vec3 sd) {
  d = normalize(d);
  float y = max(d.y, 0.0);
  float t = 1.0 - clamp(y / 0.55, 0.0, 1.0);
  vec3 c = skyRamp(t);
  float s = max(dot(d, sd), 0.0);
  c = mix(c, vec3(1.0, 0.86, 0.63), pow(s, 5.0) * 0.55 * smoothstep(0.25, 0.95, t));
  vec2 hd = normalize(d.xz + 1e-5), hs = normalize(sd.xz);
  float away = clamp(-dot(hd, hs), 0.0, 1.0);
  c = mix(c, vec3(0.063, 0.082, 0.29), away * 0.3 * (1.0 - smoothstep(0.2, 0.9, t)));
  vec3 nc = mix(vec3(0.012, 0.016, 0.06), vec3(0.06, 0.07, 0.19), t * t) + vec3(0.3, 0.15, 0.17) * pow(t, 8.0) * 0.55;
  c = mix(c, nc, uNight);
  c = mix(c, mix(vec3(0.6, 0.58, 0.67), vec3(0.06, 0.062, 0.1), uNight) * (0.9 + 0.1 * t), uWet);
  return c;
}`;
const skyGroup = new THREE.Group(); scene.add(skyGroup);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sunDir: { value: SUN }, uTime, uNight, uWet },
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: SKY_GLSL + `
    uniform vec3 sunDir; uniform float uTime; varying vec3 vD;
    void main(){
      vec3 d = normalize(vD);
      vec3 c = skyColor(vec3(d.x, max(d.y, 0.0), d.z), sunDir);
      vec3 u = normalize(cross(sunDir, vec3(0.0, 1.0, 0.0))), v = cross(u, sunDir);
      vec3 p = d - sunDir * dot(d, sunDir);
      float ang = atan(dot(p, v), dot(p, u));
      float s = max(dot(d, sunDir), 0.0);
      float rays = (0.5 + 0.5 * sin(ang * 34.0 + sin(ang * 7.0) * 2.0)) * pow(s, 2.5) * smoothstep(-0.02, 0.25, d.y + 0.05);
      c += vec3(1.0, 0.9, 0.78) * rays * 0.12 * (1.0 - uNight) * (1.0 - uWet);
      if (d.y < 0.0) { c = mix(c, vec3(0.78, 0.55, 0.66), clamp(-d.y * 5.0, 0.0, 1.0)); c = mix(c, vec3(0.16, 0.13, 0.33), smoothstep(0.08, 0.75, -d.y)); }
      gl_FragColor = vec4(c, 1.0);
    }`,
});
skyGroup.add(new THREE.Mesh(new THREE.SphereGeometry(3600, 48, 24), skyMat));

const glowTex = canvasTex(64, 64, (g) => {
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,0.4)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
});
const glowSprite = (color, size, opacity = 1) => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity, fog: false }));
  s.scale.set(size, size, 1); return s;
};
const sun = glowSprite(0xffd8a8, 220, 1); sun.position.copy(SUN).multiplyScalar(3000); skyGroup.add(sun);
const moon = glowSprite(0xdde6ff, 90, 0); moon.position.copy(MOON).multiplyScalar(2800); skyGroup.add(moon);

// stars
{
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = R() * TAU, e = (0.05 + R() * 0.7) * Math.PI / 2;
    const d = dirAzEl(a, e); pos.set([d.x * 3200, d.y * 3200, d.z * 3200], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xfff6e0, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false, fog: false }));
  skyGroup.add(stars); window.__stars = stars;
}

// ---------------------------------------------------------------- cumulus (Da Nang-style peach/lavender billboards)
const CLOUD_LIGHT = new THREE.Vector3(-0.85, 0.12, 0.5).normalize();
const clouds = [], cloudParts = [];
for (let c = 0; c < 54; c++) {
  const r = lerp(70, 700, Math.pow(R(), 0.65)), size = rnd(18, 50);
  const cl = { ang: rnd(TAU), r, y: rnd(110, 290), sp: rnd(0.006, 0.014) * (R() < 0.85 ? 1 : -1), bob: rnd(TAU), first: cloudParts.length };
  const n = 12 + Math.floor(size / 1.8);
  for (let k = 0; k < n; k++) {
    const base = k < 5, ox = base ? (k - 2) * size * 0.42 + gauss() * size * 0.08 : gauss() * size * 0.5, oz = gauss() * size * (base ? 0.25 : 0.32);
    const spread = 1 - Math.min(0.6, Math.abs(ox) / (size * 1.3)), s = base ? size * rnd(0.95, 1.2) : size * rnd(0.6, 1.05) * spread;
    const oy = base ? s * 0.12 : s * 0.3 + Math.abs(gauss()) * size * 0.34 * spread;
    const lit = clamp(0.5 + 0.5 * (ox * CLOUD_LIGHT.x + oz * CLOUD_LIGHT.z) / (size * 0.6));
    cloudParts.push({ ox, oy, oz, sx: base ? s * 1.6 : s, sy: base ? s * 0.55 : s, rel: clamp(oy / (size * 0.95)), lit, rot: base ? rnd(-0.15, 0.15) : rnd(TAU) });
  }
  cl.count = n; clouds.push(cl);
}
const puffTex = canvasTex(128, 128, (g) => {
  const im = g.createImageData(128, 128);
  for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) {
    const dx = (x - 63.5) / 60, dy = (y - 63.5) / 60, r = Math.hypot(dx, dy), nz = N.fbm(x * 0.045 + 11, y * 0.045 - 7, 4);
    const a = clamp(sstep(1.0, 0.25, r + nz * 0.35) * (0.8 + 0.5 * nz));
    const k = (y * 128 + x) * 4; im.data[k] = im.data[k + 1] = im.data[k + 2] = 255; im.data[k + 3] = Math.round(a * 255);
  }
  g.putImageData(im, 0, 0);
});
const CN = cloudParts.length, cloudPos = new Float32Array(CN * 3);
const cloudGeo = new THREE.InstancedBufferGeometry();
{ const pg = new THREE.PlaneGeometry(1, 1); cloudGeo.index = pg.index; cloudGeo.setAttribute('position', pg.attributes.position); cloudGeo.setAttribute('uv', pg.attributes.uv); }
cloudGeo.setAttribute('iPos', new THREE.InstancedBufferAttribute(cloudPos, 3).setUsage(THREE.DynamicDrawUsage));
cloudGeo.setAttribute('iSize', new THREE.InstancedBufferAttribute(new Float32Array(cloudParts.flatMap((p) => [p.sx, p.sy])), 2));
cloudGeo.setAttribute('iShade', new THREE.InstancedBufferAttribute(new Float32Array(cloudParts.flatMap((p) => [p.rel, p.lit, p.rot])), 3));
cloudGeo.instanceCount = CN;
const cloudMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  uniforms: { uTex: { value: puffTex }, uNight, uFog: { value: FOG }, uFogNear: { value: FOG_NEAR }, uFogFar: { value: FOG_FAR } },
  vertexShader: `attribute vec3 iPos; attribute vec2 iSize; attribute vec3 iShade; varying vec2 vUv; varying vec2 vQ; varying vec3 vShade; varying float vDist;
    void main(){ vShade = iShade; vQ = position.xy + 0.5;
      float c = cos(iShade.z), s = sin(iShade.z); vUv = mat2(c, -s, s, c) * (uv - 0.5) + 0.5;
      vec4 mv = viewMatrix * vec4(iPos, 1.0); mv.xy += position.xy * iSize; vDist = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: rampGLSL('cloudRamp', CLOUD_STOPS) + `
    uniform sampler2D uTex; uniform float uNight; uniform vec3 uFog; uniform float uFogNear; uniform float uFogFar;

function makeWater(cx, cz, rx, rz, rot = 0) {

}

function routeLen(pts) {
  let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);

  for (let i = 1; i < pts.length; i++) {
    const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (left <= seg) {
      const t = left / (seg || 1);
      const x = lerp(pts[i - 1][0], pts[i][0], t), z = lerp(pts[i - 1][1], pts[i][1], t);
      const y = Math.max(H(x, z), WATER_Y) + 0.45;
      const dx = pts[i][0] - pts[i - 1][0], dz = pts[i][1] - pts[i - 1][1];

    }
    left -= seg;
  }
  const p = pts[pts.length - 1];
  return { x: p[0], y: H(p[0], p[1]) + 0.45, z: p[1], yaw: 0 };
}

const FW_N = 4500, fwPos = new Float32Array(FW_N * 3), fwCol = new Float32Array(FW_N * 3), fwA = new Float32Array(FW_N), fwS = new Float32Array(FW_N);

}));

const FW_COLS = ['#ff4a5a', '#ffd34a', '#5fd8ff', '#c070ff', '#5dff8a', '#ffffff', '#ff8a2a', '#ff3df0'].map(col);
const shells = [];
let nextShell = 0;
const spark = (x, y, z, vx, vy, vz, life, c, size, drag, grav) => {
  const s = sparks[sparkI]; sparkI = (sparkI + 1) % FW_N;
  Object.assign(s, { x, y, z, vx, vy, vz, life, max: life, c, size, drag, grav });
};
function burst(x, y, z, c) {
  const n = 60 + Math.floor(R() * 50);
  for (let i = 0; i < n; i++) {
    const a = R() * TAU, e = R() * Math.PI, sp = rnd(8, 22);
    spark(x, y, z, Math.cos(a) * Math.sin(e) * sp, Math.cos(e) * sp, Math.sin(a) * Math.sin(e) * sp, rnd(0.9, 1.8), c, rnd(1.8, 3.2), 1.4, 12);
  }
  // water reflection sparks
  for (let i = 0; i < 20; i++) {
    spark(x + rnd(-4, 4), WATER_Y + 0.5, z + rnd(-4, 4), rnd(-2, 2), rnd(0.5, 2), rnd(-2, 2), rnd(0.4, 0.9), c, rnd(1.2, 2.2), 2, 4);
  }
  if (soundOn) sfxBoom(x, y, z);
}
function updateFireworks(t, dt, on) {
  if (on && t > nextShell) {
    nextShell = t + rnd(0.55, 1.4);
    const a = rnd(TAU), r = rnd(0, 40);
    const x = LK.cx + Math.cos(a) * r, z = LK.cz + Math.sin(a) * r;
    shells.push({ x, y: WATER_Y + 1, z, vy: rnd(38, 55), life: 1, c: pick(FW_COLS), age: 0 });
  }
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.age += dt; s.y += s.vy * dt; s.vy -= 28 * dt;
    spark(s.x, s.y, s.z, rnd(-1, 1), rnd(-1, 1), rnd(-1, 1), 0.25, col('#ffd8a0'), 1.4, 2, 5);
    if (s.vy < 4 || s.age > 1.6) { burst(s.x, s.y, s.z, s.c); shells.splice(i, 1); }
  }
  for (let i = 0; i < FW_N; i++) {
    const s = sparks[i];
    if (s.life <= 0) { fwA[i] = 0; continue; }
    s.life -= dt;
    s.vx *= Math.exp(-s.drag * dt); s.vz *= Math.exp(-s.drag * dt); s.vy -= s.grav * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    fwPos.set([s.x, s.y, s.z], i * 3);
    fwCol.set([s.c.r, s.c.g, s.c.b], i * 3);
    fwA[i] = clamp(s.life / s.max); fwS[i] = s.size;
  }
  fwGeo.attributes.position.needsUpdate = true;
  fwGeo.attributes.aCol.needsUpdate = true;
  fwGeo.attributes.aA.needsUpdate = true;
  fwGeo.attributes.aS.needsUpdate = true;
}

// ---------------------------------------------------------------- hand-drawn pass: ink outlines, pencil hatching, paper tooth, vignette
const grainTex = (() => {
  const S = 256, d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const v = 0.5 + 0.5 * (N.fbm(x / 9, y / 9, 3) * 0.7 + (R() - 0.5) * 0.6), w = 0.5 + 0.5 * N.fbm(x / 23 + 50, y / 23, 3);
    const i = (y * S + x) * 4; d[i] = clamp(v) * 255; d[i + 1] = clamp(w) * 255; d[i + 2] = R() * 255; d[i + 3] = 255;
  }
  const t = new THREE.DataTexture(d, S, S, THREE.RGBAFormat); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.minFilter = t.magFilter = THREE.LinearFilter; t.needsUpdate = true; return t;
})();
let rt = null;
const post = new THREE.ShaderMaterial({
  uniforms: { tColor: { value: null }, tDepth: { value: null }, tGrain: { value: grainTex }, res: { value: new THREE.Vector2(1, 1) }, cn: { value: camera.near }, cf: { value: camera.far } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tColor; uniform sampler2D tDepth; uniform sampler2D tGrain; uniform vec2 res; uniform float cn; uniform float cf; varying vec2 vUv;
    float lin(vec2 uv){ float z = texture2D(tDepth, uv).r * 2.0 - 1.0; return (2.0 * cn * cf) / (cf + cn - z * (cf - cn)); }
    void main(){
      vec2 px = 1.0 / res;
      vec2 w = (texture2D(tGrain, vUv * res / 256.0 * 0.35).gb - 0.5) * px * 2.0;
      vec2 uv = vUv + w;
      float d0 = lin(uv);
      float dx = lin(uv + vec2(px.x, 0.0)) - lin(uv - vec2(px.x, 0.0));
      float dy = lin(uv + vec2(0.0, px.y)) - lin(uv - vec2(0.0, px.y));
      float edge = clamp((abs(dx) + abs(dy)) / (d0 * 0.035) - 0.35, 0.0, 1.0) * smoothstep(2400.0, 400.0, d0);
      vec3 c = texture2D(tColor, vUv).rgb;
      // soft bloom of bright spots
      vec3 b = texture2D(tColor, vUv + px * vec2(2.0,0.0)).rgb + texture2D(tColor, vUv + px * vec2(-2.0,0.0)).rgb
             + texture2D(tColor, vUv + px * vec2(0.0,2.0)).rgb + texture2D(tColor, vUv + px * vec2(0.0,-2.0)).rgb;
      b *= 0.25;
      c += max(b - 0.52, 0.0) * 0.65;
      float g = texture2D(tGrain, vUv * res / 256.0).r;
      float lum = dot(c, vec3(0.3, 0.55, 0.15));
      float hp = fract((gl_FragCoord.x + gl_FragCoord.y) / 6.0 + (g - 0.5) * 0.7);
      c *= 1.0 - smoothstep(0.55, 0.72, hp) * smoothstep(0.42, 0.12, lum) * 0.24;
      c = mix(c, c * vec3(0.3, 0.27, 0.45) + vec3(0.03, 0.02, 0.08), edge * 0.8);
      c *= 0.9 + 0.1 * g; c = mix(c, vec3(0.95, 0.9, 0.82), (1.0 - g) * 0.04);
      vec2 q = vUv - vec2(0.47, 0.52); c *= 1.0 - dot(q, q) * 0.75;
      gl_FragColor = vec4(c, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  if (camera.userData.fov0 === undefined) camera.userData.fov0 = camera.fov;
  camera.fov = 2 * Math.atan(Math.tan(camera.userData.fov0 * Math.PI / 360) * Math.min(2.1, Math.max(1, 1.2 / camera.aspect))) * 180 / Math.PI;
  camera.updateProjectionMatrix();
  const pw = Math.floor(w * DPR), ph = Math.floor(h * DPR);
  if (rt) { rt.depthTexture.dispose(); rt.dispose(); }
  const depth = new THREE.DepthTexture(pw, ph); depth.type = THREE.UnsignedIntType;
  rt = new THREE.WebGLRenderTarget(pw, ph, { depthTexture: depth, depthBuffer: true });
  post.uniforms.tColor.value = rt.texture; post.uniforms.tDepth.value = rt.depthTexture; post.uniforms.res.value.set(pw, ph);
}

for (let i = 0; i < RAIN_N; i++) { rainSeed[i * 4] = R() * RB; rainSeed[i * 4 + 1] = R() * RB; rainSeed[i * 4 + 2] = R(); rainSeed[i * 4 + 3] = rnd(0.8, 1.2); }
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: col('#dfe4f4'), transparent: true, opacity: 0, depthWrite: false, fog: false }));
rain.frustumCulled = false; rain.visible = false; scene.add(rain);
const wrap = (v, lo, span) => lo + ((((v - lo) % span) + span) % span);
function updateRain(t) {
  const c = camera.position, x0 = c.x - RB / 2, z0 = c.z - RB / 2, y0 = c.y - RH * 0.6;
  for (let i = 0; i < RAIN_N; i++) {
    const sp = rainSeed[i * 4 + 3], x = wrap(rainSeed[i * 4] + t * 5, x0, RB), z = wrap(rainSeed[i * 4 + 1], z0, RB), y = wrap(rainSeed[i * 4 + 2] * RH - t * 70 * sp, y0, RH);
    rainPos.set([x, y, z, x - 0.35, y + 2.6 * sp, z], i * 6);
  }
  rainGeo.attributes.position.needsUpdate = true;
}

// lantern show
let lanternOn = false, lanternT = 0;
const lanternBtn = document.getElementById('lantern');
const endLantern = () => { lanternOn = false; lanternBtn.setAttribute('aria-pressed', 'false'); lanterns.forEach((L) => { L.g.visible = false; }); };
lanternBtn.addEventListener('click', () => {
  if (lanternOn) { endLantern(); return; }
  stopFollow(); controls.autoRotate = false; orbitBtn.setAttribute('aria-pressed', 'false');
  if (timeTarget < 0.95) setTime(1);
  VIEWS.lantern = { pos: new THREE.Vector3(LK.cx + 55, 22, LK.cz + 70), target: new THREE.Vector3(LK.cx, 18, LK.cz - 10) };
  flyTo(VIEWS.lantern);
  lanternOn = true; lanternT = 0; lanternBtn.setAttribute('aria-pressed', 'true');
  lanterns.forEach((L) => { L.g.visible = true; L.h = rnd(6, 20); });
});

function updateLanterns(t, dt) {
  if (!lanternOn) return;
  lanternT += dt;
  for (const L of lanterns) {
    L.h += dt * 3.5;
    if (L.h > 70) L.h = rnd(6, 16);
    const a = L.a + t * L.sp;
    const x = LK.cx + Math.cos(a) * L.r + Math.sin(t * 0.7 + L.ph) * 2;
    const z = LK.cz + Math.sin(a) * L.r + Math.cos(t * 0.5 + L.ph) * 2;
    L.g.position.set(x, WATER_Y + L.h, z);
    L.gl.material.opacity = 0.55 + 0.35 * Math.sin(t * 2 + L.ph);
  }
  if (lanternT > 48) endLantern();
}

// sound
let AC = null, master = null, soundOn = false;
const snd = {};
const soundBtn = document.getElementById('sound');
function initAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return false;
  AC = new Ctx(); master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  const buf = (sec, fill) => { const b = AC.createBuffer(1, Math.floor(AC.sampleRate * sec), AC.sampleRate); fill(b.getChannelData(0)); return b; };
  snd.white = buf(3, (d) => { for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; });
  snd.brown = buf(4, (d) => { let l = 0; for (let i = 0; i < d.length; i++) { l = (l + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = l * 3.5; } });
  snd.crackle = buf(1.4, (d) => { for (let i = 0; i < d.length; i++) d[i] = Math.random() < 0.0016 ? (Math.random() * 2 - 1) * (1 - i / d.length) : 0; });
  const loop = (b, ...nodes) => {
    const s = AC.createBufferSource(); s.buffer = b; s.loop = true; let n = s;
    for (const x of nodes) { n.connect(x); n = x; }
    const g = AC.createGain(); g.gain.value = 0; n.connect(g); g.connect(master); s.start(); return g;
  };
  const filt = (type, f, q) => { const b = AC.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b; };
  snd.city = loop(snd.brown, filt('lowpass', 180));
  snd.rain = loop(snd.white, filt('highpass', 900), filt('lowpass', 7000));
  snd.lake = loop(snd.brown, filt('lowpass', 320));
  snd.filt = filt; snd.nextHorn = 0;
  return true;
}
soundBtn.addEventListener('click', () => {
  if (!AC && !initAudio()) { soundBtn.textContent = 'No sound'; return; }
  soundOn = !soundOn; if (AC.state === 'suspended') AC.resume();
  master.gain.setTargetAtTime(soundOn ? 0.85 : 0, AC.currentTime, 0.25);
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
});
const oneShot = (b, when, gain, decay, ...nodes) => {
  const s = AC.createBufferSource(); s.buffer = b; let n = s;
  for (const x of nodes) { n.connect(x); n = x; }
  const g = AC.createGain();
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(gain, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, when + decay);
  n.connect(g); g.connect(master); s.start(when); s.stop(when + decay + 0.1);
};
function sfxBoom(x, y, z) {
  if (!AC || !soundOn) return;
  const d = camera.position.distanceTo(tmpV.set(x, y, z)), when = AC.currentTime + Math.min(1.2, d / 420), g = clamp(140 / d, 0.06, 0.85);
  oneShot(snd.brown, when, g * 1.5, 1.3, snd.filt('lowpass', rnd(110, 220)));
  oneShot(snd.white, when, g * 0.22, 0.3, snd.filt('bandpass', 900, 0.8));
}
function updateSound(t, n) {
  if (!AC || !soundOn) return;
  const now = AC.currentTime, hgt = clamp((camera.position.y - 20) / 350);
  snd.city.gain.setTargetAtTime(0.28 * (1 - 0.35 * n) * (1 - 0.5 * hgt), now, 0.5);
  snd.lake.gain.setTargetAtTime(0.12 * (1 - 0.3 * hgt), now, 0.5);
  snd.rain.gain.setTargetAtTime(0.16 * wxRain, now, 0.5);
  if (t > snd.nextHorn) {
    snd.nextHorn = t + rnd(5, 12);
    const f0 = rnd(380, 540), g = 0.018 * (1 - 0.6 * hgt), w = now;
    const o = AC.createOscillator(), og = AC.createGain(), lp = snd.filt('lowpass', 1600);
    o.type = 'square'; o.frequency.value = f0; o.connect(lp); lp.connect(og); og.connect(master);
    og.gain.setValueAtTime(0, w); og.gain.linearRampToValueAtTime(g, w + 0.01);
    og.gain.setValueAtTime(g, w + 0.1); og.gain.linearRampToValueAtTime(0, w + 0.14);
    o.start(w); o.stop(w + 0.18);
  }
}

// night update
const nightC = new THREE.Color();
function updateNight(t, dt) {
  timeV += clamp(timeTarget - timeV, -dt * 0.35, dt * 0.35);
  const n = uNight.value = sstep(0.3, 0.95, timeV), dusk = sstep(0, 0.45, timeV);
  SUN.copy(dirAzEl(-42 * DEG, lerp(4, -8, sstep(0, 0.7, timeV)) * DEG));
  sun.position.copy(SUN).multiplyScalar(3000);
  sun.material.opacity = 1 - sstep(0.2, 0.5, timeV);
  moon.material.opacity = n * 0.85;
  if (window.__stars) window.__stars.material.opacity = n * 0.9;
  FOG.copy(FOG_DAY).lerp(FOG_DUSK, dusk * (1 - n)).lerp(FOG_NIGHT, n);
  hemiLight.intensity = lerp(0.95, 0.4, n); hemiLight.color.copy(HEMI_DAY).lerp(HEMI_NIGHT, n);
  sunLight.intensity = lerp(1.25, 0.7, dusk) * (1 - n); sunLight.color.copy(SUNC_DAY).lerp(SUNC_DUSK, dusk);
  fillLight.intensity = lerp(0.28, 0.4, n);
  scene.fog.color.copy(FOG);

  // lamps & windows
  const te = Math.max(timeV, wxRain * 0.3);
  for (const L of LAMP_POS) {
    L.gl.material.opacity = sstep(0.08, 0.4, te) * 0.85;
    L.head.material.color.set(te > 0.2 ? '#fff2d0' : '#b0a8c0');
  }
  scene.traverse((o) => {
    if (o.userData && o.userData.winGlow) o.material.opacity = sstep(0.1, 0.55, te) * 0.7;
    if (o.userData && o.userData.bridgeLantern) o.material.opacity = sstep(0.05, 0.35, te) * 0.9;
  });
  if (turtleTower.userData.glow) turtleTower.userData.glow.material.opacity = sstep(0.15, 0.5, te) * 0.8;
  for (const m of winMats) {
    const on = te > 0.25;
    m.color.set(on ? '#ffe2b0' : '#141228');
  }
  for (const s of scooters) s.headlight.material.opacity = n * 0.75;

  updateFireworks(t, dt, timeV > 0.6 && wxRain < 0.3 && !lanternOn);
  updateLanterns(t, dt);
  updateSound(t, n);

  // weather
  wxRain += ((wxMode === 1 ? 1 : 0) - wxRain) * Math.min(1, dt * 0.5);
  wxMist += ((wxMode === 2 ? 1 : 0) - wxMist) * Math.min(1, dt * 0.5);
  const wet = Math.max(wxRain, wxMist * 0.85);
  uWet.value = wet * 0.85;
  scene.fog.near = FOG_NEAR * (1 - 0.9 * wet);
  scene.fog.far = FOG_FAR * (1 - 0.75 * wxRain - 0.85 * wxMist * (1 - wxRain));
  rain.visible = wxRain > 0.01; rain.material.opacity = 0.4 * wxRain * (1 - 0.35 * n);
  if (rain.visible) updateRain(t);
  sunLight.intensity *= 1 - 0.7 * wet;
}

// flag wave
function updateFlag(t) {
  const f = flagTower.userData.flag;
  if (!f) return;
  f.rotation.y = Math.sin(t * 2.2) * 0.15;
  f.scale.x = 1 + Math.sin(t * 3.1) * 0.04;
}

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
let t = 0, lastFrame = -1e9;
const still = reduceMotion;
function frame(now) {
  if (LOW_POWER && now - lastFrame < 32) { requestAnimationFrame(frame); return; }
  lastFrame = now;
  const dt = Math.min(0.05, clock.getDelta());
  if (!still) t += dt;
  uTime.value = t;
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.6);
    const k = sstep(0, 1, fly.t);
    camera.position.lerpVectors(fly.p0, fly.to.pos, k);
    controls.target.lerpVectors(fly.q0, fly.to.target, k);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  if (inDisc(camera.position.x, camera.position.z, 2)) {
    const gy = H(camera.position.x, camera.position.z) + 3;
    if (camera.position.y < gy) camera.position.y = gy;
  }
  skyGroup.position.copy(camera.position);
  updateClouds(t);
  updateNight(t, dt);
  updateTraffic(dt);
  updateFlag(t);

  if (follow >= 0) {
    const s = scooters[follow], q = s.q;
    const back = 12 * followZoom;
    const fx = q.x - Math.sin(q.yaw + followYaw) * back;
    const fz = q.z - Math.cos(q.yaw + followYaw) * back;
    const fy = q.y + 5 + followPitch * 10;
    camera.position.lerp(tmpV.set(fx, fy, fz), 1 - Math.exp(-dt * 3));
    controls.target.lerp(new THREE.Vector3(q.x, q.y + 1.2, q.z), 1 - Math.exp(-dt * 3));
  }

  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(frame);
}
loadingEl.hidden = true;
requestAnimationFrame(frame);
})();
</script>
